  --ink: #252428;
  --muted: #777481;
  --line: #e7e7e9;
  --blue: #3446e4;
  --purple: #6c32e8;
  --danger: #bd2435;
  --surface: #f7f7f9;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: #fff;
  color: var(--ink);
  font-family: Manrope, "Avenir Next", Avenir, Arial, sans-serif;
}
button,
input {
  font: inherit;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
.page {
  width: 100%;
  margin: 0 auto;
  padding: 32px 14px 84px;
}
.heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.eyebrow {
  color: var(--blue);
  font-size: 9px;
  font-weight: 820;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.heading h1 {
  margin: 9px 0 6px;
  font-size: 28px;
  line-height: 1.08;
  letter-spacing: -0.045em;
  font-weight: 680;
}
.heading p {
  max-width: 310px;
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}
.clear-wrap {
  position: relative;
  flex: 0 0 auto;
}
.clear-all {
  padding: 7px 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.clear-confirm {
  position: absolute;
  right: 0;
  top: 0;
  z-index: 12;
  width: 225px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 12px 30px rgba(37, 36, 40, 0.12);
  font-size: 9px;
  white-space: nowrap;
}
.clear-confirm button {
  padding: 5px 7px;
  border: 0;
  border-radius: 6px;
  background: #f1f1f3;
  color: #55515c;
  cursor: pointer;
}
.clear-confirm button:last-child {
  background: #fff0f1;
  color: var(--danger);
}
.search-area {
  position: relative;
  z-index: 10;
  margin-top: 23px;
}
.search-box {
  width: 100%;
  min-height: 62px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 40px 40px 42px;
  align-items: end;
  gap: 7px;
  padding: 10px;
  border: 1.5px solid #c9c8cd;
  border-radius: 15px;
  background: #fff;
  cursor: text;
  transition:
    0.18s border-color,
    0.18s box-shadow;
}
.search-box.focused {
  border-color: var(--blue);
  box-shadow:
    0 0 0 4px rgba(52, 70, 228, 0.08),
    0 12px 34px rgba(37, 36, 40, 0.06);
}
.search-box.listening {
  border-color: #6657db;
  box-shadow:
    0 0 0 4px rgba(102, 87, 219, 0.09),
    0 12px 34px rgba(37, 36, 40, 0.06);
}
.search-box > svg {
  display: none;
}
.input-flow {
  grid-column: 1/-1;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  min-width: 0;
}
.input-flow input {
  height: 38px;
  flex: 1;
  min-width: 145px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
}
.input-flow input::placeholder {
  color: #9a98a1;
}
.input-flow input:disabled {
  cursor: wait;
}
.voice-button {
  position: relative;
  grid-column: 2;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid #e1e0e4;
  border-radius: 10px;
  background: #fff;
  color: #64616a;
  cursor: pointer;
  transition:
    0.18s background,
    0.18s color;
}
.voice-button:hover {
  background: #f1f1f4;
  color: var(--ink);
}
.voice-button.listening {
  color: #5d45d3;
  background: #eeeaff;
}
.voice-button.error {
  color: #a92735;
  background: #fff0f1;
  border-color: #f3cfd3;
}
.voice-pulse {
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(93, 69, 211, 0.4);
  border-radius: 7px;
  animation: voice-ring 1.25s ease-out infinite;
}
@keyframes voice-ring {
  70% {
    transform: scale(1.2);
    opacity: 0;
  }
}
.voice-message {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 8px;
  padding: 0 3px;
  color: #706d77;
  font-size: 8px;
}
.voice-message > span {
  width: 6px;
  height: 6px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #7c69e5;
}
.voice-message.listening > span {
  animation: pulse 1.1s infinite;
}
.voice-message.error {
  color: #9d2733;
}
.voice-message.error > span {
  background: #c33a48;
}
.voice-message button {
  display: grid;
  place-items: center;
  margin-left: auto;
  padding: 3px;
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.filter-button {
  grid-column: 3;
}
.search-button {
  grid-column: 4;
}
.voice-button,
.filter-button,
.search-button {
  height: 40px;
  border-radius: 10px;
  cursor: pointer;
}
.filter-button {
  width: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #e1e0e4;
  background: #fff;
  color: #64616a;
}
.filter-button span {
  display: none;
}
.filter-button.active {
  color: var(--ink);
  background: #f3f3f5;
}
.search-button {
  width: 42px;
  display: grid;
  place-items: center;
  border: 0;
  background: var(--ink);
  color: #fff;
}
.search-button:disabled {
  opacity: 0.18;
  cursor: default;
}
.spinner {
  width: 17px;
  height: 17px;
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.criterion {
  position: relative;
  min-height: 34px;
  display: inline-flex;
  align-items: stretch;
  border: 1px solid transparent;
  border-radius: 9px;
  white-space: nowrap;
}
.criterion button {
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.criterion-main {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 3px 5px 7px;
}
.criterion-main > span:nth-child(2) {
  max-width: 125px;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 10px;
  font-weight: 760;
}
.criterion-main small {
  padding: 3px 5px;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.75);
  font-size: 7px;
  font-weight: 850;
  text-transform: uppercase;
}
.criterion-main small.confidence {
  color: #8a6418;
  background: #fff3ca;
}
.criterion-remove {
  display: grid;
  place-items: center;
  padding: 0 7px 0 3px !important;
  opacity: 0.55;
}
.criterion-remove:hover {
  opacity: 1;
}
.chevron {
  font-size: 11px;
}
.role-symbol {
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
  font-size: 9px;
  font-weight: 900;
}
.role-symbol.must {
  color: #18744c;
  background: #dff4e9;
}
.role-symbol.should {
  color: #2e53d2;
  background: #e4eaff;
}
.role-symbol.exclude {
  color: #b31222;
  background: #ffe1e4;
}
.tag-criterion.weight-must {
  color: #2439be;
  background: #eef0ff;
  border-color: #dce0ff;
}
.tag-criterion.weight-should {
  color: #615e68;
  background: #f7f7f9;
  border-color: #c9c8ce;
  border-style: dashed;
}
.tag-criterion.weight-exclude {
  color: #b31222;
  background: #fff0f1;
  border-color: #ffd9dd;
}
.tag-criterion.uncertain {
  border-color: #d79d28;
  background: #fffaf0;
  box-shadow: inset 0 0 0 1px rgba(215, 157, 40, 0.08);
}
.weight-exclude .criterion-main > span:nth-child(2) {
  text-decoration: line-through;
  text-decoration-color: rgba(179, 18, 34, 0.45);
}
.smart-criterion {
  gap: 6px;
  align-items: center;
  padding-left: 7px;
  color: #3e3b45;
  background: #f3f3f5;
  border-color: #e5e4e7;
}
.smart-criterion .smart-type {
  padding: 3px 5px;
  border-radius: 5px;
  background: #fff;
  color: #777481;
  font-size: 7px;
  font-weight: 820;
  text-transform: uppercase;
}
.smart-criterion strong {
  max-width: 130px;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 10px;
}
.smart-artist,
.smart-track,
.smart-album {
  background: #f3f0ff;
  border-color: #e3dbff;
  color: #5b3ca5;
}
.smart-date,
.smart-recognition {
  background: #fff8e9;
  border-color: #f4e4bd;
  color: #795e24;
}
.smart-tempo,
.smart-harmony {
  background: #eff9f4;
  border-color: #d4eddf;
  color: #276b49;
}
.smart-isrc,
.smart-iswc {
  background: #eef7fa;
  border-color: #d9ebf1;
  color: #2d667b;
}
.source-criterion {
  max-width: 290px;
  align-items: center;
  gap: 6px;
  padding-left: 7px;
  color: #5d36ae;
  background: #f6f1ff;
  border-color: #e5d9ff;
}
.source-criterion.youtube {
  min-height: 42px;
  padding: 3px 4px 3px 3px;
  color: #a92b32;
  background: #fff2f2;
  border-color: #f5d7d9;
}
.source-copy {
  min-width: 0;
  display: grid;
  align-content: center;
  gap: 1px;
}
.source-criterion .source-copy strong {
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 9px;
}
.source-copy small {
  max-width: 150px;
  overflow: hidden;
  color: #a76065;
  font-size: 7px;
  text-overflow: ellipsis;
}
.youtube-chip-thumb {
  position: relative;
  width: 54px;
  height: 34px;
  flex: 0 0 auto;
  overflow: hidden;
  border-radius: 7px;
  background: #e7e6e9;
}
.youtube-chip-thumb img,
.youtube-suggestion-thumb img {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}
.youtube-thumb-fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #dfd3d5, #f2e8e9);
  color: #b94049;
}
.youtube-chip-thumb > span:last-child,
.youtube-suggestion-thumb > span:last-child {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: 50%;
  display: grid;
  place-items: center;
  transform: translate(-50%, -50%);
  border-radius: 5px;
  background: #e52929;
  color: #fff;
}
.youtube-chip-thumb > span:last-child {
  width: 20px;
  height: 15px;
}
.source-icon {
  display: grid;
  place-items: center;
}
.source-arrow {
  display: none;
}
.criteria-toggle {
  min-height: 34px;
  padding: 0 9px;
  border: 1px solid #d8d7dc;
  border-radius: 9px;
  background: #fff;
  color: #5e5b64;
  font-size: 9px;
  font-weight: 760;
  cursor: pointer;
}
.mobile-collapsed {
  display: none;
}
.weight-menu {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  z-index: 45;
  width: auto;
  padding: 7px;
  border: 1px solid #dfdee3;
  border-radius: 14px;
  background: #fff;
  color: var(--ink);
  box-shadow: 0 18px 58px rgba(37, 36, 40, 0.2);
  white-space: normal;
}
.weight-menu > div {
  padding: 9px 10px;
  color: #817e87;
  font-size: 10px;
  font-weight: 680;
}
.weight-menu > button {
  width: 100%;
  display: grid;
  grid-template-columns: 18px 1fr auto;
  align-items: center;
  gap: 9px;
  padding: 10px;
  border-radius: 9px;
  text-align: left;
}
.weight-menu > button.selected {
  background: #f6f6f8;
}
.weight-menu > button > span:nth-child(2) {
  display: grid;
  gap: 1px;
}
.weight-menu strong {
  font-size: 11px;
}
.weight-menu small {
  color: #8a8790;
  font-size: 9px;
}
.weight-menu em {
  min-width: 62px;
  color: #777481;
  font-size: 9px;
  font-style: normal;
  text-align: right;
}
.weight-menu em:after {
  content: " tracks";
  font-size: 7px;
  color: #aaa7af;
}
.suggestions,
.filter-panel {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 7px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 18px 54px rgba(37, 36, 40, 0.14);
  z-index: 25;
}
.suggestions {
  padding: 7px;
}
.suggestion-heading {
  display: flex;
  justify-content: space-between;
  padding: 7px 8px;
  color: #99969f;
  font-size: 8px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.suggestion-heading span:last-child {
  display: none;
}
.suggestions > button {
  width: 100%;
  display: grid;
  grid-template-columns: 32px 1fr;
  align-items: center;
  gap: 9px;
  padding: 8px;
  border: 0;
  border-radius: 9px;
  background: #fff;
  text-align: left;
  cursor: pointer;
}
.suggestions > button.active {
  background: #f7f7f9;
}
.suggestions > button:disabled {
  cursor: default;
  opacity: 0.58;
}
.suggestions > button.youtube-suggestion {
  grid-template-columns: 72px minmax(0, 1fr);
  padding: 9px;
}
.youtube-suggestion-thumb {
  position: relative;
  width: 72px;
  height: 44px;
  overflow: hidden;
  border-radius: 8px;
  background: #e7e6e9;
}
.youtube-suggestion-thumb > span:last-child {
  width: 24px;
  height: 18px;
}
.youtube-suggestion-meta {
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-top: 3px;
}
.youtube-suggestion-meta strong,
.youtube-suggestion-meta small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.youtube-suggestion-meta strong {
  color: #46434b;
  font-size: 9px;
}
.youtube-suggestion-meta small {
  color: #94919a;
  font-size: 8px;
}
.suggestion-icon {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: #55515d;
  background: #eeeef1;
}
.suggestion-icon.prompt {
  color: #6c32e8;
  background: #efe8ff;
}
.suggestion-icon.tagbundle {
  color: #2439be;
  background: #eef0ff;
}
.suggestion-icon.youtube {
  color: #d52e2e;
  background: #ffebeb;
}
.suggestions > button > span:nth-child(2) {
  min-width: 0;
  display: grid;
  gap: 3px;
}
.suggestion-title-line {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 7px;
}
.suggestion-title-line strong {
  min-width: 0;
}
.recommended-badge {
  flex: 0 0 auto;
  padding: 3px 5px;
  border-radius: 5px;
  background: #e8f5ed;
  color: #1d704b;
  font-size: 7px;
  font-weight: 850;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.suggestion-tag-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 3px;
}
.preview-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 5px 4px 7px;
  border: 1px solid #dce0ff;
  border-radius: 7px;
  background: #eef0ff;
  color: #3343b7;
  font-size: 8px;
  font-weight: 730;
}
.preview-tag b {
  padding: 2px 4px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.76);
  font-size: 6px;
  text-transform: uppercase;
}
.preview-tag.should {
  border-color: #d7d5dc;
  border-style: dashed;
  background: #f7f7f9;
  color: #625f68;
}
.preview-tag.exclude {
  border-color: #ffd9dd;
  background: #fff0f1;
  color: #ad2332;
}
.preview-tag.uncertain {
  border-color: #ddb65d;
  background: #fff9e9;
  color: #805e17;
}
.suggestions strong,
.suggestions small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.suggestions strong {
  font-size: 11px;
}
.suggestions small {
  color: #88858e;
  font-size: 8px;
}
.suggestions em {
  display: none;
}
.criteria-summary-trigger {
  width: 100%;
  min-height: 34px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 7px;
  padding: 5px 7px 5px 10px;
  border: 1px solid #e4e3e7;
  border-radius: 10px;
  background: #fbfbfc;
  color: #6f6c75;
  text-align: left;
  cursor: pointer;
}
.criteria-summary-trigger > span:first-child {
  margin-right: 2px;
  font-size: 8px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.criteria-summary-trigger b {
  padding: 3px 5px;
  border-radius: 5px;
  background: #fff;
  font-size: 7px;
  font-weight: 780;
}
.criteria-summary-trigger .summary-must {
  color: #2540bc;
}
.criteria-summary-trigger .summary-should {
  color: #67636d;
}
.criteria-summary-trigger .summary-exclude {
  color: #ad2332;
}
.criteria-summary-trigger .summary-filters {
  color: #276b49;
}
.criteria-summary-trigger .summary-chevron {
  margin-left: auto;
  color: #817e87;
  font-size: 11px;
}
.criteria-summary-panel {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  z-index: 46;
  overflow: hidden;
  border: 1px solid #dfdee3;
  border-radius: 15px;
  background: #fff;
  box-shadow: 0 22px 62px rgba(37, 36, 40, 0.22);
}
.criteria-summary-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 14px;
  border-bottom: 1px solid #ececef;
}
.criteria-summary-head > div {
  display: grid;
  gap: 2px;
}
.criteria-summary-head strong {
  font-size: 12px;
}
.criteria-summary-head small {
  color: #8b8891;
  font-size: 8px;
}
.criteria-summary-head > button,
.summary-group > div > span > button {
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  color: #85828b;
  cursor: pointer;
}
.criteria-summary-groups {
  max-height: min(58vh, 440px);
  display: grid;
  gap: 12px;
  overflow-y: auto;
  padding: 14px;
  background: #fbfbfc;
}
.summary-group {
  display: grid;
  gap: 6px;
}
.summary-group header {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #74717a;
  font-size: 8px;
  font-weight: 820;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.summary-group header b {
  min-width: 18px;
  padding: 2px 5px;
  border-radius: 999px;
  background: #ececf0;
  color: #625f68;
  text-align: center;
  font-size: 7px;
}
.summary-group > div {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.summary-group > div > span {
  min-height: 29px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 5px 4px 8px;
  border: 1px solid #e1e0e4;
  border-radius: 8px;
  background: #fff;
  color: #504d56;
  font-size: 8px;
  font-weight: 720;
}
.summary-group > div > span > span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.summary-group > div small {
  padding: 2px 4px;
  border-radius: 4px;
  background: #f0f0f3;
  color: #777481;
  font-size: 6px;
  text-transform: uppercase;
}
.summary-group.must > div > span {
  border-color: #dce0ff;
  background: #f3f4ff;
  color: #3343b7;
}
.summary-group.should > div > span {
  border-style: dashed;
}
.summary-group.exclude > div > span {
  border-color: #ffd9dd;
  background: #fff3f4;
  color: #ad2332;
}
.summary-group.filters > div > span {
  border-color: #d4eddf;
  background: #f2faf6;
  color: #276b49;
}
.filter-panel {
  overflow: hidden;
}
.filter-panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 16px 15px 13px;
}
.filter-panel-head > div {
  display: grid;
  gap: 4px;
}
.filter-panel-head strong {
  font-size: 15px;
}
.filter-panel-head small {
  color: #88858e;
  font-size: 11px;
  line-height: 1.4;
}
.filter-panel-head > button {
  border: 0;
  background: transparent;
  color: #777481;
  cursor: pointer;
}
.filter-tabs {
  display: flex;
  overflow-x: auto;
  padding: 0 8px;
  border-bottom: 1px solid #ececef;
}
.filter-tabs button {
  padding: 11px 13px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: #84818a;
  font-size: 12px;
  font-weight: 750;
  white-space: nowrap;
  cursor: pointer;
}
.filter-tabs button.active {
  color: var(--blue);
  border-color: var(--blue);
}
.filter-body {
  min-height: 205px;
  padding: 19px 15px;
  background: #fbfbfc;
}
.tag-browser {
  display: grid;
  gap: 11px;
}
.tag-browser-search {
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 11px;
  border: 1px solid #dcdbe0;
  border-radius: 10px;
  background: #fff;
  color: #777481;
}
.tag-browser-search:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(52, 70, 228, 0.07);
}
.tag-browser-search input {
  min-width: 0;
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 13px;
}
.tag-browser-search button {
  display: grid;
  place-items: center;
  padding: 3px;
  border: 0;
  background: transparent;
  color: #88858e;
  cursor: pointer;
}
.tag-categories {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.tag-categories button {
  flex: 0 0 auto;
  padding: 7px 10px;
  border: 1px solid #e1e0e4;
  border-radius: 999px;
  background: #fff;
  color: #74717a;
  font-size: 11px;
  font-weight: 720;
  cursor: pointer;
}
.tag-categories button.active {
  border-color: #b9c0ff;
  background: #eef0ff;
  color: #293ec5;
}
.tag-family-browser {
  display: grid;
  gap: 7px;
  padding: 10px;
  border: 1px solid #e4e3e7;
  border-radius: 11px;
  background: #fff;
}
.tag-family-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}
.tag-family-label > span {
  color: #55525b;
  font-size: 11px;
  font-weight: 820;
}
.tag-family-label small {
  color: #99969f;
  font-size: 9px;
}
.tag-families {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding-bottom: 3px;
  scrollbar-width: none;
}
.tag-families::-webkit-scrollbar {
  display: none;
}
.tag-families button {
  min-height: 31px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
  padding: 6px 8px;
  border: 1px solid #e2e1e5;
  border-radius: 8px;
  background: #fafafa;
  color: #625f68;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
}
.tag-families button small {
  min-width: 17px;
  padding: 2px 4px;
  border-radius: 999px;
  background: #ececf0;
  color: #85818b;
  font-size: 8px;
  text-align: center;
}
.tag-families button.active {
  border-color: #bcc3ff;
  background: #eef0ff;
  color: #293ec5;
}
.tag-families button.active small {
  background: #dfe3ff;
  color: #293ec5;
}
.tag-browser-meta {
  display: flex;
  justify-content: space-between;
  color: #98959e;
  font-size: 10px;
}
.tag-grid {
  max-height: 250px;
  display: grid;
  gap: 11px;
  overflow-y: auto;
  padding-right: 3px;
}
.tag-family-group {
  display: grid;
  gap: 5px;
}
.tag-family-items {
  display: grid;
  gap: 6px;
}
.tag-family-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-top: 7px;
  padding: 4px 3px 1px;
  color: #777481;
}
.tag-family-group:first-child .tag-family-heading {
  margin-top: 0;
}
.tag-family-heading strong {
  color: #55525b;
  font-size: 11px;
  font-weight: 820;
}
.tag-family-heading span {
  color: #aaa7af;
  font-size: 8px;
  font-weight: 720;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.tag-family-items > button {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 12px;
  border: 1px solid #e4e3e7;
  border-radius: 9px;
  background: #fff;
  color: #45424b;
  text-align: left;
  cursor: pointer;
}
.tag-family-items > button:hover {
  border-color: #cbd0ff;
  background: #fafaff;
}
.tag-family-items > button.selected {
  border-color: #dce0ff;
  background: #f2f3ff;
  color: #3346c5;
}
.tag-family-items > button > span:first-child {
  min-width: 0;
  display: grid;
  gap: 2px;
}
.tag-grid strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}
.tag-grid small {
  overflow: hidden;
  color: #96939c;
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tag-add {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #f0f0f3;
  color: #5d5963;
  font-size: 13px;
  font-weight: 700;
}
.selected .tag-add {
  background: #dfe3ff;
  color: #293ec5;
}
.tag-browser-empty {
  padding: 34px 18px;
  color: #8c8992;
  font-size: 11px;
  text-align: center;
}
.picker {
  max-width: 700px;
  margin: 0 auto;
}
.segmented {
  width: max-content;
  display: flex;
  padding: 3px;
  border: 1px solid #e1e0e4;
  border-radius: 9px;
  background: #fff;
}
.segmented button {
  padding: 8px 12px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #777481;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.segmented button.active {
  color: var(--ink);
  background: #efeff2;
}
.date-fields {
  display: grid;
  gap: 10px;
  margin-top: 15px;
}
.date-fields label,
.range-values label {
  display: grid;
  gap: 5px;
}
.date-fields label > span,
.range-values label > span {
  color: #85828b;
  font-size: 10px;
  font-weight: 750;
  text-transform: uppercase;
}
.date-fields label > div,
.range-values label > div {
  height: 46px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  border: 1px solid #dedde2;
  border-radius: 9px;
  background: #fff;
}
.date-fields input,
.range-values input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 13px;
}
.range-values {
  display: grid;
  grid-template-columns: 1fr 18px 1fr;
  align-items: end;
  gap: 5px;
}
.range-values > span {
  padding-bottom: 13px;
  color: #aaa7af;
  font-size: 10px;
  text-align: center;
}
.range-values input {
  font-size: 15px;
  font-weight: 750;
}
.range-values b {
  color: #99969f;
  font-size: 10px;
}
.dual-range {
  position: relative;
  height: 26px;
  margin-top: 17px;
}
.dual-range:before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 12px;
  height: 4px;
  border-radius: 4px;
  background: linear-gradient(90deg, #e2e2e6, #5262e9, #e2e2e6);
}
.dual-range input {
  position: absolute;
  left: 0;
  top: 3px;
  width: 100%;
  height: 20px;
  pointer-events: none;
  appearance: none;
  background: transparent;
}
.dual-range input::-webkit-slider-thumb {
  width: 18px;
  height: 18px;
  border: 3px solid #fff;
  border-radius: 50%;
  appearance: none;
  background: var(--blue);
  box-shadow: 0 1px 5px rgba(38, 50, 165, 0.35);
  pointer-events: auto;
}
.scale {
  display: flex;
  justify-content: space-between;
  color: #9b98a0;
  font-size: 9px;
}
.fame-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.fame-head > div:first-child {
  display: grid;
}
.fame-head strong {
  font-size: 21px;
}
.fame-head span {
  color: #8d8a93;
  font-size: 10px;
}
.fame-legend {
  display: flex;
  gap: 12px;
}
